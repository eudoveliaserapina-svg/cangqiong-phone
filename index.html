<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>苍穹山，喵～</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#2e3a36;--sub:#6d7c76;--bg:#f3f2e9;--card:#fbfaf4;--line:#dcd9c6;--jade:#6fae9b;--gold:#c8a85a;--me:#cfe6dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e6ece8;--sub:#9db0a8;--bg:#1d2623;--card:#26312d;--line:#37443f;--me:#3b6354}}
:root[data-theme="dark"]{--ink:#e6ece8;--sub:#9db0a8;--bg:#1d2623;--card:#26312d;--line:#37443f;--me:#3b6354}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:#c9d4cd;font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif CJK SC",serif;color:var(--ink)}
button,input{font:inherit;color:inherit}
#app{position:relative;max-width:430px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg)}
.scr{position:absolute;inset:0;display:none;overflow:hidden}.scr.on{display:block}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#intro{background:#e8efe6}
#txt{position:absolute;top:27%;left:0;right:0;text-align:center;font-size:clamp(17px,5.2vw,22px);letter-spacing:.28em;line-height:2.4;color:#26352f}
#txt p{min-height:2.4em}
#tap{position:absolute;bottom:9%;width:100%;text-align:center;color:#5d6f67;letter-spacing:.3em;font-size:14px;animation:bl 2.4s infinite}
@keyframes bl{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){#tap{animation:none}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 2.2s;z-index:8}
#mus{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:rgba(251,250,244,.85);color:#3a4a44;font-size:16px}
#mus.off{opacity:.45}
#clock{position:absolute;top:13%;width:100%;text-align:center;color:#2e3f38}
#clock b{display:block;font-size:56px;font-weight:400;letter-spacing:.06em}
#clock span{font-size:15px;letter-spacing:.2em}
#apps{position:absolute;left:0;right:0;bottom:12%;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;padding:0 20px}
.ap{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;color:#2e3f38}
.ap i{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;color:#fff;background:linear-gradient(145deg,#8cc4b2,#5c9a87);border:1px solid rgba(200,168,90,.8);box-shadow:0 3px 10px rgba(60,100,85,.25)}
.ap:nth-child(2) i{background:linear-gradient(145deg,#e2cf94,#b99a4e)}
.ap:nth-child(3) i{background:linear-gradient(145deg,#d9d6c3,#9a9a88)}
.ap:nth-child(4) i{background:linear-gradient(145deg,#a9bfd8,#6f8db3);font-size:17px}
.hd{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--card);font-size:17px}
.hd button{border:0;background:none;font-size:22px;padding:0 6px}
.hd .sp{flex:1}
.aff{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-right:44px}
.aff u{display:block;width:60px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.aff u s{display:block;height:100%;background:var(--jade)}
.pg{position:absolute;top:52px;bottom:54px;left:0;right:0;overflow-y:auto}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-style:normal;background:#8aa}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.row b{font-weight:400;font-size:16px;display:block}.row small{color:var(--sub);font-size:13px}
.gav{width:42px;height:42px;display:grid;grid-template-columns:1fr 1fr;gap:1px;border-radius:8px;overflow:hidden;flex:none}
.gav .av{width:100%;height:100%;border-radius:0;font-size:10px}
.tabs{position:absolute;bottom:0;left:0;right:0;height:54px;display:flex;border-top:1px solid var(--line);background:var(--card)}
.tabs button{flex:1;border:0;background:none;font-size:15px;color:var(--sub)}.tabs .on{color:var(--ink);box-shadow:inset 0 -2px var(--gold)}
.m{display:flex;gap:8px;margin:10px 12px;align-items:flex-start}.m.me{flex-direction:row-reverse}
.b{max-width:70%;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);line-height:1.55;font-size:15px}
.me .b{background:var(--me);border-color:transparent}
.in{position:absolute;bottom:0;left:0;right:0;height:54px;display:flex;gap:8px;align-items:center;padding:0 10px;border-top:1px solid var(--line);background:var(--card)}
.in input{flex:1;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--bg);padding:0 14px;outline:none}
.in input:focus-visible,.hd button:focus-visible,.ap:focus-visible,.pin:focus-visible{outline:2px solid var(--gold)}
.in button{border:0;border-radius:19px;background:var(--jade);color:#fff;padding:0 16px;height:38px}
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.post p{line-height:1.6;margin:3px 0 6px}.post small{color:var(--sub)}
.post button{border:0;background:none;color:var(--sub);float:right}.post button.lk{color:#b0463a}
.mapw{position:relative;margin-top:calc((100% - 100vw)/2)}
.mw{position:relative;width:100%;aspect-ratio:1}.mw img{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);padding:5px 10px;border-radius:14px;background:rgba(251,250,244,.93);border:1px solid var(--gold);font-size:13px;color:#2e3a36}
.hint{text-align:center;color:#6d7c76;font-size:13px;margin-top:12px;letter-spacing:.15em}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:none;z-index:5;max-height:62%;overflow:auto}
#sheet h3{font-weight:400;font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between}
#sheet h3 button{border:0;background:none;font-size:20px}
#sheet li{line-height:1.6;margin:6px 0 6px 18px;font-size:14.5px}
.who{display:flex;gap:6px;margin:10px 0}.who .av{width:34px;height:34px;font-size:14px;cursor:pointer}
.evt{margin-top:12px;padding:10px 12px;border:1px dashed var(--gold);border-radius:10px;font-size:14px;line-height:1.6}
.evt button{margin-left:8px;border:0;border-radius:12px;background:var(--jade);color:#fff;padding:3px 12px}
#nw{background:#efeee9;color:#2a2420;overflow-y:auto}
.sq{position:relative;width:100%;aspect-ratio:1}.sq>img{width:100%;height:100%;display:block}
#ov{position:absolute;left:27%;top:34%;width:67%;height:60%;overflow-y:auto;font-size:13px;line-height:1.75}
#ov h4,.col h4{font-size:15px;margin-bottom:4px}
#dt{position:absolute;left:3%;top:92.3%;width:20%;text-align:center;font-size:11px;color:#3a2f28}
.col{padding:6px 20px 14px;line-height:1.75;font-size:14px;border-top:1px solid #c9c3b2;margin:0 14px}
#rf{display:block;margin:6px auto 80px;border:1px solid #8a7a62;background:none;border-radius:14px;padding:5px 22px;color:#4a3d32}
.bk{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;border:1px solid var(--gold);background:rgba(251,250,244,.92);color:#2e3a36;border-radius:16px;padding:6px 14px}
#ts{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(40,52,47,.88);color:#fff;padding:8px 16px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;white-space:nowrap}
#gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:rgba(251,250,244,.85);color:#3a4a44;font-size:14px;z-index:3}
.fm{padding:18px;display:flex;flex-direction:column;gap:14px}.fm label{font-size:14px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
.fm input{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;outline:none}
.fm button{height:42px;border:0;border-radius:21px;background:var(--jade);color:#fff}.fm p{font-size:13px;color:var(--sub);line-height:1.7}
</style></head><body><div id="app">
<section id="intro" class="scr on"><img class="bg" id="i1" alt=""><div id="txt"><p id="l1"></p><p id="l2"></p></div><div id="tap">轻触屏幕　开启故事</div></section>
<section id="home" class="scr"><img class="bg" id="i2" alt=""><div id="clock"><b id="hm"></b><span id="dy"></span></div>
<button id="gear" data-go="st" aria-label="设置">设</button><div id="apps"><button class="ap" data-go="chat"><i>聊</i>聊天</button><button class="ap" data-go="mp"><i>图</i>地图</button><button class="ap" data-go="nw"><i>报</i>苍穹山快报</button><button class="ap" id="sei"><i>Sei</i>Sei</button></div></section>
<section id="chat" class="scr"><div class="hd"><button data-go="home" aria-label="返回">‹</button>聊天</div><div class="pg" id="pg"></div><div class="tabs"><button class="on" data-t="msg">消息</button><button data-t="mom">朋友圈</button></div></section>
<section id="talk" class="scr"><div class="hd"><button data-go="chat" aria-label="返回">‹</button><span id="tn"></span><span class="sp"></span><span class="aff" id="af"></span></div><div class="pg" id="ms" style="bottom:54px"></div><div class="in"><input id="ip" placeholder="说点什么……" autocomplete="off"><button id="sd">发送</button></div></section>
<section id="mp" class="scr"><div class="hd" style="position:absolute;top:0;left:0;right:0"><button data-go="home" aria-label="返回">‹</button>苍穹山舆图</div><div style="position:absolute;top:52px;bottom:0;left:0;right:0;display:flex;flex-direction:column;justify-content:center;background:#f4f1e4"><div class="mw"><img id="i4" alt="苍穹山附近地图"></div><p class="hint">点按地名，查看近况</p></div><div id="sheet"></div></section>
<section id="nw" class="scr"><div style="position:absolute;inset:0;overflow-y:auto"><div class="sq"><img id="i3" alt=""><div id="ov"></div><div id="dt"></div></div><div id="cols"></div><button id="rf">刷新</button></div><button class="bk" data-go="home">‹ 返回</button></section>
<section id="st" class="scr"><div class="hd"><button data-go="home" aria-label="返回">‹</button>设置</div><div class="fm"><label>DeepSeek API Key<input id="kk" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-"></label><label>你的称呼<input id="nm" placeholder="小友"></label><button id="sv">保存</button><button id="tt" style="background:#c8a85a">测试连接</button><p id="rs"></p><p>Key 只保存在这台设备的浏览器里，不会上传到别处。没填时使用预设台词。</p></div></section>
<div id="flash"></div><button id="mus" hidden aria-label="音乐开关">♪</button><div id="ts"></div></div>
